[package]
name = "av-diagram"
version = "0.2.0"
description = "AV Diagram : synoptiques d'installations audiovisuelles"
authors = ["Hervé Obejero"]
license-file = "../LICENSE.md"
repository = "https://github.com/Herve-obe/AV-DIAGRAM_Claude-Code"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "av_diagram_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
# Assistant IA (lot 6) : requêtes vers le seul fournisseur choisi, clé dans le trousseau du système
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
