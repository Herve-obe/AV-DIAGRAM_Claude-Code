# Intégration continue : lint, types, tests et build à chaque push et pull request ; contrôles natifs,
# installeur Windows et application macOS à chaque push. Un rouge ici signale un vrai défaut.
# L'essai du modèle d'IA réel (long, dépendant de la machine) est dans local-ai.yml, hors contrôles bloquants.
name: CI
on:
  push:
  pull_request:
jobs:
  check:
    # Un push sur une branche du dépôt lance déjà ces contrôles : la pull request ne les relance que pour un dépôt tiers
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install reportlab==4.4.9
      - run: python scripts/build-manual.py
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Upload generated manual
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: AV-Diagram-Manual-test
          path: public/manuel.pdf
          retention-days: 30

  native:
    # Un push sur une branche du dépôt lance déjà ces contrôles : la pull request ne les relance que pour un dépôt tiers
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branche stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install reportlab==4.4.9
      - run: python scripts/build-manual.py
      - run: npm run build
      - name: Prepare verified local AI engine
        run: python scripts/prepare-local-ai.py
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build Windows test installer
        if: github.event_name == 'push'
        run: npm run desktop:build -- --bundles nsis --ci
      - name: Upload Windows test installer
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: AV-Diagram-Windows-test
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Test native window layout across relaunches
        if: github.event_name == 'push'
        run: python scripts/test-window-layout.py src-tauri/target/release/av-diagram.exe

  windows-installer:
    if: github.event_name == 'push'
    needs: native
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AV-Diagram-Windows-test
          path: src-tauri/target/release/bundle/nsis
      - name: Test installer maintenance and uninstall
        run: python scripts/test-windows-installer.py

  macos:
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 70
    env:
      # Signature locale pour les essais, sans certificat de distribution Apple.
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branche stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install reportlab==4.4.9
      - run: python scripts/build-manual.py
      - run: npm run build
      - name: Prepare verified local AI engines
        run: python3 scripts/prepare-local-ai.py
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build universal macOS test application
        run: npm run desktop:build -- --target universal-apple-darwin --bundles app --ci
      - name: Verify universal app and signature
        run: |
          lipo "src-tauri/target/universal-apple-darwin/release/bundle/macos/AV Diagram.app/Contents/MacOS/av-diagram" -verify_arch x86_64 arm64
          codesign --verify --deep --strict "src-tauri/target/universal-apple-darwin/release/bundle/macos/AV Diagram.app"
      - name: Create and verify macOS test disk image
        run: |
          bundle="src-tauri/target/universal-apple-darwin/release/bundle"
          staging="${{ runner.temp }}/avd-dmg"
          mkdir -p "$staging" "$bundle/dmg"
          ditto "$bundle/macos/AV Diagram.app" "$staging/AV Diagram.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "AV Diagram" -srcfolder "$staging" -ov -format UDZO "$bundle/dmg/AV Diagram_universal.dmg"
          hdiutil verify "$bundle/dmg/AV Diagram_universal.dmg"
      - name: Upload macOS test installer
        uses: actions/upload-artifact@v4
        with:
          name: AV-Diagram-macOS-universal-test
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

