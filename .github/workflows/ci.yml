name: Verification Windows 0.5.10
on: push
permissions:
  contents: read
  actions: read
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AV-Diagram-Windows-test
          path: src-tauri/target/release/bundle/nsis
          run-id: 39980323562
          github-token: ${{ github.token }}
      - name: Test exact installer artifact
        run: python scripts/test-windows-installer.py
  window-layout:
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AV-Diagram-Windows-test
          path: installer
          run-id: 39980323562
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract the exact application without installation
        shell: pwsh
        run: |
          $package = Get-ChildItem installer -Filter '*-setup.exe'
          if ($package.Count -ne 1) { throw 'Expected one installer' }
          & 7z x $package.FullName "-o$env:RUNNER_TEMP/avd-layout" -y
          if ($LASTEXITCODE -ne 0) { throw 'Extraction failed' }
      - name: Test native layout on a fresh desktop
        shell: pwsh
        run: |
          $binaries = @(Get-ChildItem "$env:RUNNER_TEMP/avd-layout" -Recurse -Filter av-diagram.exe)
          if ($binaries.Count -ne 1) { throw 'Expected one application' }
          python scripts/test-window-layout.py $binaries[0].FullName
