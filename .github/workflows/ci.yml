# Intégration continue : lint, types, tests et build à chaque push et pull request.
name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build Windows test installer
        if: github.event_name == 'push'
        run: npm run desktop:build -- --bundles nsis --ci
      - name: Upload Windows test installer
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: AV-Diagram-Windows-test
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30

  windows-installer:
    if: github.event_name == 'push'
    needs: native
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AV-Diagram-Windows-test
          path: src-tauri/target/release/bundle/nsis
      - name: Test installer maintenance and uninstall
        run: python scripts/test-windows-installer.py

  macos:
    if: github.event_name == 'push'
    runs-on: macos-15
    env:
      # Signature locale pour les essais, sans certificat de distribution Apple.
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build universal macOS test installer
        run: npm run desktop:build -- --target universal-apple-darwin --bundles app,dmg --ci
      - name: Verify universal app and signature
        run: |
          lipo "src-tauri/target/universal-apple-darwin/release/bundle/macos/AV Diagram.app/Contents/MacOS/av-diagram" -verify_arch x86_64 arm64
          codesign --verify --deep --strict "src-tauri/target/universal-apple-darwin/release/bundle/macos/AV Diagram.app"
      - name: Upload macOS test installer
        uses: actions/upload-artifact@v4
        with:
          name: AV-Diagram-macOS-universal-test
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

